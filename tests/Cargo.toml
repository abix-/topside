# The tests, a crate of their own: they test the running game over its
# control plane, so building them never builds or touches the game.
# One test binary (`all`, like factoriobot's), every file a module.
[package]
name = "topside-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[test]]
name = "all"
path = "all.rs"

[dev-dependencies]
serde_json = "1"
ureq = { version = "3", features = ["json"] }
