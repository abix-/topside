# The tests, a crate of their own: building them builds the topside
# library, never topside.exe, so the running game is never touched.
# One test binary (`all`, like factoriobot's), every file a module.
[package]
name = "topside-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[test]]
name = "all"
path = "all.rs"

[dev-dependencies]
avian2d = { version = "0.7", default-features = false, features = ["2d", "f32", "parry-f32", "parallel"] }
bevy = "0.19"
modforge = { path = "../../modforge/modforge" }
serde_json = "1"
topside = { path = ".." }
ureq = { version = "3", features = ["json"] }
