[workspace]
members = ["3d", "content"]
resolver = "3"

# The 2D game (docs/design.md "What 2D changes").
[package]
name = "topside"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
avian2d = { version = "0.7", default-features = false, features = ["2d", "f32", "parry-f32", "parallel"] }
bevy = "0.19"
modforge = { path = "../modforge/modforge" }
topside-content = { path = "content" }

# Fast iteration: light optimization for our code, full for deps
# (Bevy is unusably slow fully unoptimized).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
