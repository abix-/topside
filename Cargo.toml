[workspace]
members = ["3d", "content"]
resolver = "3"

# Fast iteration: light optimization for our code, full for deps
# (Bevy is unusably slow fully unoptimized).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
