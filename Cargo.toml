[workspace]
members = ["3d", "content", "tests"]
resolver = "3"

# The game: one 3D world played in first person (docs/authority.md
# "Presentation").
[package]
name = "topside"
version = "0.1.0"
edition = "2024"
publish = false
# The tests are their own crate (tests/Cargo.toml).
autotests = false

[dependencies]
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
# The navigation mesh (docs/pathing.md "A navigation mesh"): Recast's Rust
# port built from the Avian colliders, walked with landmass.
avian_rerecast = "0.6"
# `trace`: every system, schedule and drawing step runs in a span, which
# the profiler adds up for the `perf` op (src/profile.rs).
bevy = { version = "0.19", features = ["trace"] }
# Frames held to 60 a second, as the world's updates are (Factorio's UPS).
bevy_framepace = "0.22"
bevy_landmass = "0.12"
bevy_rerecast = "0.5"
landmass_rerecast = "0.3"
modforge = { path = "../modforge/modforge" }
moonshine-save = "0.7"
ron = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
topside-content = { path = "content" }

# landmass 0.9.2 with one guard where it hands its steering to dodgy_2d:
# dodgy's solving failed on a NaN and stopped the game (backtrace through
# landmass avoidance.rs, 2026-10-02; docs/pathing.md). The guard keeps a
# velocity that is not a number from dodgy, and if dodgy still fails, that
# step walks the preferred way. It catches the failure only where panics
# unwind (not the release profile's abort). Report upstream; drop when fixed.
#
# bevy_rerecast_core 0.5.0 with its generator made callable from the fixed
# step (generator/mod.rs, "topside patch"): no once-a-frame gathering and
# landing in PostUpdate; `gather`, `land` and `cancel_all` (the world
# rolled again drops what was building) for the game to call, and a
# `NavmeshFailed` event where a failed build was a silent skip. Why:
# authority.md rule 5, every tick a pure result of state (a mesh is the
# world at the tick it was asked for and lands at a fixed tick, the step
# waiting for it if late; a failure lands as its own result, never a hang),
# 2026-10-02. Drop when bevy_rerecast lets the game drive when meshes are
# gathered and landed, and reports failures.
[patch.crates-io]
landmass = { path = "vendor/landmass" }
bevy_rerecast_core = { path = "vendor/bevy_rerecast_core" }

# Fast iteration: light optimization for our code, full for deps
# (Bevy is unusably slow fully unoptimized). Deps carry no debug info:
# with it every test program's debug file (.pdb) outgrew the MSVC
# linker's limit (LNK1318 LIMIT 12) and links stalled or failed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
# Deps run without their debug-only checks, as they do in a release:
# Avian's move and slide hands Bevy a contact normal of length 0.98
# (move_and_slide.rs:554) and Bevy's debug check panics on it once
# thousands of people are packed together. Our own code keeps its.
debug-assertions = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
