[workspace]
members = ["3d", "content", "tests"]
resolver = "3"

# The game: one 3D world played in first person (docs/authority.md
# "Presentation").
[package]
name = "topside"
version = "0.1.0"
edition = "2024"
publish = false
# The tests are their own crate (tests/Cargo.toml).
autotests = false

[dependencies]
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "parallel"] }
bevy = "0.19"
modforge = { path = "../modforge/modforge" }
serde_json = "1"
topside-content = { path = "content" }

# Fast iteration: light optimization for our code, full for deps
# (Bevy is unusably slow fully unoptimized). Deps carry no debug info:
# with it every test program's debug file (.pdb) outgrew the MSVC
# linker's limit (LNK1318 LIMIT 12) and links stalled or failed.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false
# Deps run without their debug-only checks, as they do in a release:
# Avian's move and slide hands Bevy a contact normal of length 0.98
# (move_and_slide.rs:554) and Bevy's debug check panics on it once
# thousands of people are packed together. Our own code keeps its.
debug-assertions = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
