# What a monument's box can hold (modforge `loot::LootTable`; design.md
# "Loot tables scale with danger"): common junk anywhere, weapons and the
# vest only where it is dangerous. Read by content's `loot_table`. A spot
# of danger 0 makes `picks` (least, most) picks; each point of danger
# adds `picks_per_danger`. Each entry has its `item` and `weight` (how
# likely against the others), and any of `layers` (a handle's head, a
# gun's parts; any handle goes with any head, design.md "What 2D
# changes"), `count` (least, most; one when left out) and `min_danger`
# (the least danger a spot must have to roll it, 0 when left out).
# Tuning.

loot:
  picks: [1, 2]
  picks_per_danger: 1
  entries:
    - {item: scrap, count: [1, 4], weight: 10}
    - {item: cloth, count: [1, 3], weight: 8}
    - {item: canned food, count: [1, 2], weight: 6}
    # One to a slot, found full (structure::spawn_monuments).
    - {item: water bottle, weight: 6}
    - {item: shotgun shell, count: [2, 5], weight: 4, min_danger: 1}
    - {item: bandage, weight: 3, min_danger: 1}
    - {item: pipe, weight: 2, min_danger: 1}
    - {item: wooden handle, layers: [nails], weight: 2, min_danger: 1}
    - {item: wooden handle, layers: [scrap blade], weight: 1, min_danger: 1}
    - {item: wooden handle, layers: [axe head], weight: 2, min_danger: 2}
    - {item: pipe, layers: [sharpened road sign], weight: 1, min_danger: 2}
    - {item: long pole, layers: [spear point], weight: 1, min_danger: 2}
    - {item: road sign vest, weight: 1, min_danger: 3}
    - {item: helmet, weight: 1, min_danger: 2}
    # Building (todo 9f; weights Claude's).
    - {item: wood, count: [5, 20], weight: 8}
    - {item: stone, count: [5, 15], weight: 5}
    - {item: building plan, weight: 3}
    - {item: hammer, weight: 3}
    - {item: tool cupboard, weight: 1, min_danger: 1}
    - {item: turret, weight: 1, min_danger: 3}
    - {item: fuel, count: [1, 3], weight: 4}
    - {item: shovel, weight: 2}
    - {item: crafting bench, weight: 1, min_danger: 1}
    - {item: research station, weight: 1, min_danger: 2}
    - {item: generator, weight: 1, min_danger: 2}
    - {item: pipe shotgun, layers: [pipe barrel, wooden grip, wooden stock], weight: 1, min_danger: 3}
    - {item: pipe shotgun, layers: [short pipe barrel, taped grip], weight: 1, min_danger: 3}
    - {item: pipe shotgun, layers: [pipe barrel, taped grip, wooden stock, nail sight], weight: 1, min_danger: 4}
    # Runes are added from content/gear.yaml (content's `loot_table`).
