  - {name: dock building, size: Large, columns: [4, 5], rows: [3, 3], floors: [2, 2], basements: [0, 0], width: [5.0, 7.0], length: [6.0, 9.0], height: [3.5, 4.5], windows: 400, clutter: 700, lights: 200, damage: 300, carve: 150, palette: *wood}
  - {name: apartment block, size: Large, columns: [4, 5], rows: [3, 4], floors: [3, 10], basements: [0, 1], width: [4.5, 6.0], length: [5.0, 7.0], height: [2.8, 3.2], windows: 700, clutter: 700, lights: 200, damage: 200, carve: 150, palette: *concrete}
