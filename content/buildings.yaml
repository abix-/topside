  - {name: bunker complex, size: Large, columns: [3, 5], rows: [3, 4], floors: [1, 1], basements: [5, 10], width: [4.5, 6.5], length: [5.0, 7.0], height: [2.6, 3.0], windows: 0, clutter: 700, lights: 400, damage: 50, carve: 100, palette: *concrete}
