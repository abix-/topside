# Pivot point 9, the fight for the tap: the first game morning after Mara's
# people are at the tap and strangers have come for the water (pivot point
# 6 reached), each stranger attacks the nearest of Mara's people, whether
# or not the player is there. It ends when either side is gone from the
# tap.
- at: FirstMorningAfter
  does:
    Order:
      do: attack
      who: {Group: {BunkerOf: Mara}}
  ends:
    Any:
    - Not:
        Alive: {who: {Group: {CameFor: tap}}, near: [{Thing: tap}, 20.0]}
    - Not:
        Alive: {who: {Group: {BunkerOf: Mara}}, near: [{Thing: tap}, 20.0]}
  name: the fight
  reached_on_arrival: null
  when:
    All:
    - Alive: {who: {Group: {BunkerOf: Mara}}, near: [{Thing: tap}, 4.0]}
    - Any:
      - Reached: trades with the strangers
      - Reached: sends the strangers away
      - Reached: points the strangers at Mara
      - Reached: takes a stranger in
  who:
    Group: {CameFor: tap}
