# The room pieces places are laid out from, and each kind of place's
# brief by tier (modforge `layout`; todo "Places rolled", the way the
# operator agreed 2026-11-23: Diablo 2's, "each house gets X number of
# pieces, and then you're able to connect the pieces together. But I want
# far more than just a couple of variations"). Read by content's
# `pieces` and `briefs`.
#
# A piece is one version of a room: the `room` it is, its `size` (across,
# along; metres), the sides it has a door spot on (`doors`: north is the
# back, south the street), its `weight` against the room's other pieces
# (1000 when left out; a set piece, the surprise, is low), its
# `furniture` (where each sits as a share of the room, -0.5 to 0.5 across
# and along, its size and its model) and its `things` (what is used in
# it, where each stands as a share of the room). Two pieces join where
# both have a door spot on the sides that meet, so the doors line up.
#
# Every piece, size, weight and brief here is Claude's (2026-11-23), a
# start for the operator to change: how many pieces each tier gets, the
# set pieces' odds and the list of surprises are the operator's.

pieces:
  # The living room, the front room: the way in from the street is on
  # its south.
  - room: living room
    size: [5.0, 5.0]
    doors: [south, north, east, west]
    furniture:
      - {at: [-0.4, 0.0], size: [0.9, 0.8, 2.0], model: couch}
      - {at: [0.3, 0.42], size: [1.4, 0.6, 0.45], model: tv stand}
      - {at: [0.25, -0.3], size: [0.8, 0.8, 0.8], model: armchair}
    things:
      - {thing: fireplace, at: [-0.45, 0.4]}
  - room: living room
    size: [6.0, 4.0]
    doors: [south, north, east]
    furniture:
