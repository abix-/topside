# What a house of each tier has (topside-town "Every place different":
# "tier 3 means we're going to have 4 bedrooms and 2 baths and so on").
# The first room is the front room. A house of a tier with no brief here
# takes the highest one below it. All one floor until a place is laid
# out over floors.
briefs:
  - place: house
    tier: 1
    rooms:
      - {room: living room, count: [1, 1]}
      - {room: kitchen, count: [1, 1]}
      - {room: hall, count: [0, 1]}
      - {room: bedroom, count: [1, 2]}
      - {room: bathroom, count: [1, 1]}
    entry: 1.2
    walls: &walls [[0.85, 0.82, 0.74], [0.70, 0.76, 0.80], [0.80, 0.72, 0.60], [0.72, 0.78, 0.66], [0.88, 0.86, 0.84], [0.62, 0.55, 0.50]]
    floor: [0.45, 0.33, 0.22]
    furniture colour: [0.55, 0.45, 0.35]
    height: 2.8
  - place: house
    tier: 2
    rooms:
      - {room: living room, count: [1, 1]}
      - {room: kitchen, count: [1, 1]}
      - {room: dining room, count: [0, 1]}
      - {room: hall, count: [1, 2]}
      - {room: bedroom, count: [2, 3]}
      - {room: bathroom, count: [1, 2]}
      - {room: laundry, count: [0, 1]}
    entry: 1.2
    walls: *walls
    floor: [0.55, 0.50, 0.45]
    furniture colour: [0.55, 0.45, 0.35]
    height: 2.8
  # The operator's tier 3: 4 bedrooms and 2 baths.
  - place: house
    tier: 3
    rooms:
      - {room: living room, count: [1, 1]}
      - {room: kitchen, count: [1, 1]}
      - {room: dining room, count: [1, 1]}
      - {room: hall, count: [2, 3]}
      - {room: bedroom, count: [4, 4]}
      - {room: bathroom, count: [2, 2]}
      - {room: laundry, count: [1, 1]}
    entry: 1.2
    walls: *walls
    floor: [0.38, 0.30, 0.25]
    furniture colour: [0.55, 0.45, 0.35]
    height: 3.0
