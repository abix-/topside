# Gear, Diablo 2's way (modforge `gear`; todo "Tiered loot", operator
# 2026-11-23: "each armor had stats... it could have an X to a Y value for
# each thing, and then each particular item might have a modifier or more
# on it"; "the rune word system, where you had some things that had
# sockets, and then you could put in a series of rune words in order to
# make a particular cool effect"; "How much did Diablo 2 plus expansion
# have? That's the model that we want, and then we want to go double
# that"; "Maybe some are runes and some are modules, and some do one type
# of thing and others do other types of things"). Read by content's
# `GEAR`.
#
# Every number written [least, most] is rolled between the two when the
# piece is found or put in. `reach` (metres), `spread` (degrees) and
# `delay` (seconds) are added to the item's own; `power` is how much harder
# hits land in hundredths (10 is a tenth harder); `armor` is added to what
# a worn piece guards.
#
# Diablo 2 with its expansion has 33 runes, and Resurrected lists 99 rune
# words; double is 66 runes and about 200 words. Every base, affix,
# family, socketable, word, name and number here is Claude's (2026-11-23),
# a start for the operator to change. The names are our own.

# How a found piece of gear comes, per mille: magic has one or two
# affixes, rare three or four, the rest are plain and may have sockets.
odds:
  magic: 250
  rare: 50

# An item as gear: its tier (1 up), its grade in the tier (0 the plain
# one, then the stronger ones above it), its own numbers and the sockets a
# plain one is found with, fewest and most (Diablo 2's go to 6).
bases:
  - item: pipe
    rolls: {power: [-5, 10], delay: [-0.05, 0.05]}
    sockets: [0, 4]
  - item: wooden handle
    rolls: {power: [-5, 10], delay: [-0.05, 0.05]}
    sockets: [0, 3]
  - item: long pole
    rolls: {power: [-5, 10], reach: [-0.2, 0.2]}
    sockets: [0, 6]
  - item: pipe shotgun
    rolls: {power: [-5, 10], spread: [-2.0, 2.0]}
    sockets: [0, 6]
  - item: road sign vest
    rolls: {armor: [-5.0, 10.0]}
    sockets: [0, 6]
  - item: helmet
    rolls: {armor: [-5.0, 10.0]}
    sockets: [0, 3]

# What a magic or rare piece rolls: the gear it goes on, the least tier of
# spot it is found at, how likely against the others (100 when left out).
affixes:
  - {name: lightweight, on: [melee, gun], rolls: {delay: [-0.15, -0.05]}}
  - {name: sharpened, on: [melee], rolls: {power: [10, 20]}}
  - {name: weighted, on: [melee], rolls: {power: [15, 30], delay: [0.05, 0.15]}}
  - {name: long, on: [melee], rolls: {reach: [0.2, 0.5]}}
  - {name: precise, on: [gun], rolls: {spread: [-4.0, -1.0]}}
  - {name: bored out, on: [gun], rolls: {power: [10, 25], spread: [1.0, 3.0]}}
  - {name: padded, on: [armor], rolls: {armor: [5.0, 15.0]}}
  - {name: plated, on: [armor], tier: 2, weight: 60, rolls: {armor: [15.0, 30.0]}}
  - {name: brutal, on: [melee, gun], tier: 2, weight: 50, rolls: {power: [25, 40]}}
  - {name: quick, on: [melee, gun], tier: 3, weight: 30, rolls: {delay: [-0.3, -0.15]}}
  - {name: fortified, on: [armor], tier: 3, weight: 30, rolls: {armor: [30.0, 50.0]}}

# The families of socketables: each fits the gear named, every kind when
# none is. Runes are old marks that make a blow land harder, faster or
# longer; modules are lost technology that steadies a gun or hardens what
# is worn.
families:
  - {name: rune}
  - {name: module, on: [gun, armor]}

# A socketable: its item, its family, and what it adds in a socket. In
# each family, lowest first: each rarer and found deeper than the one
# before, and three of one make one of the next at the bench.
socketables:
  - {item: ash rune, family: rune, rolls: {power: [3, 3]}}
  - {item: bent rune, family: rune, rolls: {delay: [-0.01, -0.01]}}
  - {item: bone rune, family: rune, rolls: {reach: [0.05, 0.05]}}
