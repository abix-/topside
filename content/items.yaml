# Every item the game has (modforge `item::ItemDef`), read by content's
# `register_items`. An item names only what it has: `name` and `kind` (Food,
# Material, Tool, Weapon, Deployable, Container, Note, Medicine, Source),
# and then any of `description` (shown when it is selected), `max_stack`
# and `quality_siblings` (each one when left out), `food` (what one use
# fills: hunger, thirst, health), `combat` (the damage it lands, delay,
# reach, pellets, spread_degrees, ammo), `storage` (the slots it holds
# standing in the world), `armor` (amount, and the area it guards: Head,
# Chest, Legs), `layer_slots` (the layers it takes on top of itself),
# `breaks_when_struck`, `holds_litres` (the water it holds). Every item is
# drawn with the picture named after it (scripts/models.py). Each
# episode's own items are in its file; the clothes everyone wears, the
# keys and the base resources are made by `register_items` from their
# lists.

items:
  - name: note
    description: Someone's words on a scrap of paper.
    kind: Note
  # The room's question when it is not the note (QUESTIONS): read as a
  # note is, by using it.
  - name: bolted door
    description: A door, bolted shut, scratched.
    kind: Note
  - name: radio
    description: A radio that clicks.
    kind: Note
  # A radio the static killed (todo Storm effect 5): silent until mended
  # at the crafting bench with a scrap (content/recipes.yaml).
  - {name: dead radio, description: "A radio the static killed. Mend it at a crafting bench with a scrap.", kind: Material}
  - name: canned food
    description: A dented can of food from before. Eat it to fill your hunger.
    kind: Food
    max_stack: 10
    # Food heals a little too (todo 10ca, Valheim). Tuning.
    food: {hunger: 50.0, thirst: 0.0, health: 5.0}
  # What food kept too long turns into (todo Survive 3): it barely fills
  # and hurts. Its numbers are Claude's.
  - name: rotten food
    description: Food kept too long. It has gone bad.
    kind: Food
    max_stack: 10
    food: {hunger: 10.0, thirst: 0.0, health: -10.0}
  # Water bottles come in sizes, each its own def (operator, 2026-10-03);
  # a bunker's barrel holds 200 L. Each holds water (design.md "Water is a
  # fluid"): drunk from a mouthful at a time, filled at a source and
  # poured from (modforge fluid). One to a slot: what each holds is its
  # own.
  - name: water bottle
    description: A plastic bottle for water, 1 litre. Drink from it; fill it at a tap, a well or a river.
    kind: Container
    holds_litres: 1.0
  - name: 5 L water bottle
    description: A big plastic bottle for water, 5 litres. Drink from it; fill it at a tap, a well or a river.
    kind: Container
    holds_litres: 5.0
  - name: water barrel
    description: A bunker's water barrel, 200 litres. Pour water into it; drink or fill a bottle from it.
    kind: Container
    holds_litres: 200.0
