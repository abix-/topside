  - {name: large oil platform, slots: [{choices: [industrial plant], min: 1, max: 1}, {choices: [barracks, lab], min: 1, max: 2}], arrangement: Clustered, danger: 5, gated: true, suffix: Rig, spacing: 180.0, height: 40.0, good for: *shelter}
