    spacing: 60.0
    height: 3.0
    props: [{picture: stone, size: [1.5, 2.5, 1.5], colour: [0.48, 0.46, 0.4], count: [4, 8], radius: 10.0}]
  # Apartment Complex: a safe place with rented rooms and shops (the safe
  # zone is the trader's own; todo Trading).
  - {name: apartment block, slots: [{choices: [apartment block], min: 1, max: 2}], arrangement: Clustered, danger: 0, suffix: Flats, spacing: 180.0, height: 30.0, good for: *shelter}
  # Outpost: the trading post.
  - {name: trading post, slots: [{choices: [supermarket, warehouse], min: 1, max: 1}, {choices: [guard tower], min: 1, max: 2}], arrangement: AroundYard, danger: 0, suffix: Post, spacing: 180.0, height: 12.0, good for: *shelter}
  # Bandit Camp: the trader's camp.
  - {name: trader's camp, slots: [{choices: [shack], min: 2, max: 4}], arrangement: Clustered, danger: 0, suffix: Camp, spacing: 180.0, height: 8.0, good for: *shelter}
  # Fishing Villages, in Rust's three sizes.
  - {name: fishing village, slots: [{choices: [shack, dock building], min: 1, max: 4}], arrangement: AlongRoad, danger: 0, suffix: Landing, spacing: 180.0, height: 8.0, good for: *shelter}
  # Mining Outpost.
  - {name: mining outpost, slots: [{choices: [workshop], min: 1, max: 1}, {choices: [shack], min: 1, max: 1}], arrangement: Clustered, danger: 1, suffix: Mine, spacing: 180.0, height: 8.0, good for: *shelter}
  # Lighthouse.
  - {name: lighthouse, slots: [{choices: [lighthouse], min: 1, max: 1}, {choices: [shack], min: 0, max: 1}], arrangement: Clustered, danger: 1, suffix: Light, spacing: 180.0, height: 20.0, good for: *shelter}
  # Stone, Sulfur and HQM Quarries.
  - {name: stone quarry, slots: [{choices: [shack, workshop], min: 1, max: 1}], arrangement: Clustered, danger: 1, suffix: Quarry, spacing: 180.0, height: 8.0, props: [{picture: stone, size: [3.0, 3.0, 3.0], colour: [0.55, 0.55, 0.52], count: [3, 6], radius: 12.0}], good for: *shelter}
  - {name: sulfur quarry, slots: [{choices: [shack, workshop], min: 1, max: 1}], arrangement: Clustered, danger: 2, suffix: Quarry, spacing: 180.0, height: 8.0, props: [{picture: stone, size: [3.0, 3.0, 3.0], colour: [0.75, 0.7, 0.3], count: [3, 6], radius: 12.0}], good for: *shelter}
  - {name: metal quarry, slots: [{choices: [shack, workshop], min: 1, max: 1}], arrangement: Clustered, danger: 3, suffix: Quarry, spacing: 180.0, height: 8.0, props: [{picture: stone, size: [3.0, 3.0, 3.0], colour: [0.45, 0.45, 0.5], count: [3, 6], radius: 12.0}], good for: *shelter}
  # Abandoned Cabins.
  - {name: cabins, slots: [{choices: [shack], min: 2, max: 3}], arrangement: Clustered, danger: 1, suffix: Cabins, spacing: 180.0, height: 6.0, good for: *shelter}
  # Caves: a rise with a box tucked in its lee, till the ground digs.
  - name: caves
    arrangement: Clustered
    danger: 2
    suffix: Caves
    spacing: 150.0
    height: 12.0
    props: [{picture: ridge, size: [30.0, 12.0, 18.0], colour: [0.4, 0.38, 0.34], count: [1, 1], centred: true}]
  # Railway and underground train stations.
  - {name: train station, slots: [{choices: [office building], min: 1, max: 1}, {choices: [shack], min: 0, max: 1}], arrangement: AlongRoad, danger: 1, suffix: Station, spacing: 180.0, height: 10.0, good for: *shelter}
  - {name: subway, slots: [{choices: [bunker complex], min: 1, max: 1}], arrangement: Clustered, danger: 3, gated: true, suffix: Underground, spacing: 180.0, height: 6.0, good for: *shelter}
