  # Abandoned Military Base.
  - {name: abandoned base, slots: [{choices: [barracks], min: 1, max: 2}, {choices: [guard tower, warehouse], min: 1, max: 2}], arrangement: AroundYard, danger: 2, suffix: Base, spacing: 180.0, height: 12.0, good for: *shelter}
  # Nuclear Missile Silo.
  - {name: missile field, slots: [{choices: [silo], min: 2, max: 3}, {choices: [bunker complex], min: 1, max: 1}], arrangement: AroundYard, danger: 5, gated: true, suffix: Field, spacing: 180.0, height: 12.0, good for: *shelter}
  # The Dome: a gas holder tower.
  - name: the dome
    slots: [{choices: [shack], min: 1, max: 1}]
    arrangement: Clustered
    danger: 3
    suffix: Dome
    spacing: 180.0
    height: 40.0
    props: [{picture: gantry, size: [14.0, 40.0, 14.0], colour: [0.5, 0.48, 0.45], count: [1, 1], centred: true}]
  # Ferry Terminal.
  - {name: ferry terminal, slots: [{choices: [dock building], min: 1, max: 1}, {choices: [warehouse, office building], min: 1, max: 2}], arrangement: AlongRoad, danger: 2, suffix: Terminal, spacing: 180.0, height: 10.0, good for: *shelter}
  # The large Harbor.
  - {name: large harbor, slots: [{choices: [dock building], min: 2, max: 2}, {choices: [warehouse], min: 2, max: 4}], arrangement: AlongRoad, danger: 3, suffix: Docks, spacing: 180.0, height: 10.0, good for: *shelter}
  # Satellite Dish.
  - name: dish array
    slots: [{choices: [lab, shack], min: 1, max: 2}]
    arrangement: AroundYard
    danger: 2
    suffix: Array
    spacing: 180.0
    height: 20.0
    props: [{picture: gantry, size: [3.0, 20.0, 3.0], colour: [0.75, 0.75, 0.78], count: [2, 4], radius: 18.0}]
    good for: *shelter
  # Satellite Crash.
  - name: crash site
