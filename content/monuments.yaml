  # Ghost Ship.
  - name: ghost ship
    arrangement: Clustered
    danger: 2
    suffix: Hulk
    spacing: 150.0
    height: 6.0
    props:
      - {picture: car wreck, size: [18.0, 6.0, 6.0], colour: [0.3, 0.28, 0.26], count: [1, 1], centred: true}
      - {picture: crate, size: [0.5, 0.5, 0.5], colour: [0.4, 0.32, 0.2], count: [1, 3], radius: 8.0}
  # Floating City.
  - {name: floating town, slots: [{choices: [shack, dock building], min: 3, max: 6}], arrangement: Clustered, danger: 0, suffix: Raft, spacing: 180.0, height: 8.0, good for: *shelter}
  # The Labyrinth's gate (todo 11v): no buildings, a locked gate across
  # the corridor and a box behind it; turned across the corridor where it
  # stands (structure::spawn_monuments). Its danger and spacing Claude's.
  - name: gate
    arrangement: Clustered
    danger: 3
    suffix: Gate
    spacing: 150.0
    height: 6.0
    props: [{picture: gate, size: [9.0, 6.0, 0.4], colour: [0.3, 0.22, 0.18], count: [1, 1], centred: true}]
