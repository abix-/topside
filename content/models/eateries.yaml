# The diner and the pizza place and every thing in them (todo Model 6, 7),
# built by scripts/models.py.
#
# Sizes are content's DINER and PIZZA_PLACE plans' (a booth 2 m by 1.2 m, the
# lunch counter 3.5 m by 0.7 m and 1.1 m tall, the kitchen line 4 m, the
# prep counter 3 m, the pizza place's tables 1 m square, its prep table
# 4 m by 0.8 m, its oven 2 m by 1.2 m); the register, pantry, stove,
# freezer, cooler and desks are the house's and the grocery's.

colours:
  vinyl: [0.65, 0.12, 0.12]
  oil: [0.7, 0.55, 0.2]
  dough: [0.92, 0.85, 0.7]

models:
  counter run:
    about: a counter of length on a plinth, its front panelled.
    template: true
    params: {length: 3.0, depth: 0.7, height: 0.9, front: steel, top: steel}
    let:
      n: max(1, round(length / 0.8))
      w: length / n
    parts:
      - box: [length, depth, height - 0.04]
        at: [0, 0, (height - 0.04) / 2]
        colour: front
      - box: [length + 0.04, depth + 0.04, 0.04]
        at: [0, 0, height - 0.02]
        colour: top
      - for: {i: range(n)}
        parts:
          - box: [w - 0.06, 0.01, height - 0.25]
            at: [-length / 2 + w * (i + 0.5), -depth / 2 - 0.005, (height - 0.04) / 2]
            colour: top

  shelving:
    about: open shelving of length, depth and height, four levels, each lined with boxes in the colours of goods.
    template: true
    params: {length: 3.0, depth: 0.5, height: 1.8, goods: [white, cardboard, yellow], frame: dark steel}
    let:
      levels: 4
      n: max(1, int(length / 0.45))
      w: length / n
    parts:
      - for: {sx: [1, -1], sy: [1, -1]}
        parts:
          - box: [0.04, 0.04, height]
            at: [sx * (length / 2 - 0.02), sy * (depth / 2 - 0.02), height / 2]
            colour: frame
      - for: {lv: range(levels)}
        let: {z: 0.08 + (height - 0.15) / (levels - 1) * lv}
        parts:
          - box: [length, depth, 0.03]
            at: [0, 0, z]
            colour: frame
          - for: {i: range(n)}
            if: lv != levels - 1
            parts:
              - box: [w - 0.08, depth - 0.1, 0.25]
                at: [-length / 2 + w * (i + 0.5), 0, z + 0.14]
                colour: goods[(lv + i) % len(goods)]

  booth:
    about: a diner booth, a table between two red vinyl benches, 2 m long.
    parts:
      - box: [0.7, 1.2, 0.04]
        at: [0, 0, 0.74]
        colour: white
      - cylinder: [0.04, 0.72]
        at: [0, 0, 0.36]
        colour: steel
      - for: {s: [1, -1]}
        parts:
          - box: [0.5, 1.2, 0.45]
            at: [s * 0.75, 0, 0.225]
            colour: vinyl
          - box: [0.15, 1.2, 0.65]
            at: [s * 0.93, 0, 0.775]
            colour: vinyl

  lunch counter:
    about: the diner's counter, chrome trim and red stools along it, 3.5 m long.
    parent: counter run
    params: {length: 3.5, depth: 0.7, height: 1.1, front: white, top: steel}
    parts:
      - for: {i: range(4)}
        let: {x: -1.3 + 0.866 * i}
        parts:
          - cylinder: [0.03, 0.7]
            at: [x, -0.65, 0.35]
            colour: steel
          - cylinder: [0.18, 0.08]
            sides: 12
            at: [x, -0.65, 0.74]
            colour: vinyl

  kitchen line:
    about: the diner's cook line, 4 m, the griddle, the fryer and the warmer.
    parent: counter run
    params: {length: 4.0, depth: 0.7, height: 0.9, front: steel, top: steel}
    parts:
      - box: [1.2, 0.6, 0.04]
        at: [-1.2, 0, 0.92]
        colour: black
      - box: [0.5, 0.5, 0.12]
        at: [0.1, 0, 0.94]
        colour: dark steel
      - box: [0.4, 0.4, 0.01]
        at: [0.1, 0, 1.0]
        colour: oil
      - box: [1.2, 0.3, 0.3]
        at: [1.2, 0.15, 1.2]
        colour: steel
      - box: [4.0, 0.7, 0.4]
        at: [0, 0.05, 2.1]
        colour: steel

  prep counter:
    about: a steel prep counter, 3 m, its cutting boards and bins.
    parent: counter run
    params: {length: 3.0, depth: 0.7, height: 0.9, front: steel, top: steel}
    parts:
      - box: [0.6, 0.4, 0.03]
        at: [-0.8, 0, 0.915]
        colour: white
      - for: {i: range(3)}
        parts:
          - box: [0.3, 0.25, 0.12]
            at: [0.3 + 0.35 * i, 0.1, 0.96]
            colour: "['green', 'red', 'yellow'][i]"

  cafe table:
    about: a square table, 1 m, with a chair at each side.
    parts:
      - box: [0.8, 0.8, 0.04]
        at: [0, 0, 0.74]
        colour: wood
      - cylinder: [0.04, 0.72]
        at: [0, 0, 0.36]
        colour: black
      - box: [0.45, 0.45, 0.03]
        at: [0, 0, 0.015]
        colour: black
      - for: {p: "[(0.42, 0), (-0.42, 0), (0, 0.42), (0, -0.42)]"}
        parts:
          - box: [0.16, 0.16, 0.03]
            at: ["p[0]", "p[1]", 0.45]
            colour: red
          - cylinder: [0.02, 0.44]
            sides: 6
            at: ["p[0]", "p[1]", 0.22]
            colour: black

  prep table:
    about: the pizza place's make table, 4 m by 0.8 m, topping wells in a row, the dough board, the cooler doors under it.
    parent: counter run
    params: {length: 4.0, depth: 0.8, height: 0.9, front: steel, top: steel}
    parts:
      - for: {i: range(8)}
        parts:
          - box: [0.3, 0.2, 0.06]
            at: [-1.75 + 0.5 * i, 0.25, 0.93]
            colour: "['red', 'yellow', 'green', 'white'][i % 4]"
      - box: [1.4, 0.4, 0.03]
        at: [0.6, -0.1, 0.915]
        colour: wood
      - cylinder: [0.18, 0.02]
        sides: 14
        at: [0.6, -0.1, 0.94]
        colour: dough

  pizza oven:
    about: a deck pizza oven, 2 m by 1.2 m, two steel decks stacked on legs, their doors and the flue.
    parts:
      - for: {k: range(2)}
        let: {z: 0.5 + 0.38 * k}
        parts:
          - box: [2.0, 1.2, 0.34]
            at: [0, 0, z]
            colour: steel
          - box: [1.6, 0.02, 0.18]
            at: [0, -0.61, z]
            colour: dark steel
          - box: [1.2, 0.04, 0.03]
            at: [0, -0.64, z + 0.06]
            colour: black
      - for: {sx: [1, -1], sy: [1, -1]}
        parts:
          - box: [0.06, 0.06, 0.33]
            at: [sx * 0.95, sy * 0.55, 0.165]
            colour: dark steel
      - cylinder: [0.1, 0.6]
        sides: 10
        at: [0.7, 0.4, 1.35]
        colour: dark steel
