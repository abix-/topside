# The school and every thing in it (todo Model 18), built by
# scripts/models.py.
#
# The furniture at the sizes content's school plan gives it (each
# classroom's rows of desks 5 m by 3 m, the office's counter 2.5 m by
# 0.7 m and 1.1 m tall, the nurse's cot 1.9 m by 0.8 m, the cafeteria's
# long table 5 m by 1 m, the kitchen's serving line 6 m by 0.7 m, the
# library's shelves 6 m by 0.5 m and 1.9 m tall, the janitor's shelves
# 5 m by 0.5 m), long side along x, front to -y, as the clinic's. The
# office desk, medicine cabinet, pantry, stove, store shelf and toolbox
# are the house's and the grocery's. Sizes and colours are Claude's.

colours:
  desk top: [0.78, 0.66, 0.45]
  chair blue: [0.25, 0.4, 0.65]
  lunch table: [0.85, 0.82, 0.72]
  tray green: [0.35, 0.55, 0.35]
  book red: [0.6, 0.18, 0.15]
  book blue: [0.2, 0.3, 0.55]
  book green: [0.22, 0.42, 0.25]
  mop grey: [0.6, 0.6, 0.55]
  vinyl: [0.25, 0.45, 0.55]
  paper: [0.95, 0.95, 0.93]

models:
  classroom desks:
    about: a classroom's three rows of four student desks, each a wood top on steel legs with a blue chair behind it, over 5 m by 3 m.
    parts:
      - for: {r: range(3), c: range(4)}
        let: {x: -1.8 + 1.2 * c, y: -1.0 + 1.0 * r}
        parts:
          - box: [0.6, 0.45, 0.03]
            at: [x, y, 0.72]
            colour: desk top
          - for: {dx: [-0.27, 0.27], dy: [-0.19, 0.19]}
            parts:
              - box: [0.03, 0.03, 0.7]
                at: [x + dx, y + dy, 0.35]
                colour: dark steel
          - box: [0.4, 0.38, 0.03]
            at: [x, y + 0.4, 0.44]
            colour: chair blue
          - box: [0.4, 0.03, 0.35]
            at: [x, y + 0.58, 0.62]
            colour: chair blue
          - for: {dx: [-0.18, 0.18]}
            parts:
              - box: [0.03, 0.35, 0.43]
                at: [x + dx, y + 0.4, 0.215]
                colour: dark steel

  school counter:
    about: the school office's front counter, 2.5 m long, a tall front with a sign-in ledge.
    parent: counter run
    params: {length: 2.5, depth: 0.7, height: 1.1, front: desk top, top: white}

  nurse's cot:
    about: the nurse's cot, 1.9 m long, a padded top on a steel frame, a paper sheet over it.
    parts:
      - box: [1.9, 0.8, 0.1]
        at: [0, 0, 0.55]
        colour: vinyl
      - box: [1.9, 0.6, 0.01]
        at: [0, 0, 0.605]
        colour: paper
      - for: {x: [-0.9, 0.9], y: [-0.35, 0.35]}
        parts:
          - box: [0.04, 0.04, 0.5]
            at: [x, y, 0.25]
            colour: steel

  lunch table:
    about: the cafeteria's long folding table, 5 m long and 1 m wide, its bench seats joined on each side, trays on it.
    parts:
      - box: [5.0, 0.75, 0.04]
        at: [0, 0, 0.74]
        colour: lunch table
      - for: {s: [-1, 1]}
        parts:
          - box: [5.0, 0.25, 0.04]
            at: [0, s * 0.55, 0.45]
            colour: chair blue
          - for: {x: [-2.2, 0.0, 2.2]}
            parts:
              - box: [0.06, 1.3, 0.04]
                at: [x, 0, 0.2]
                colour: dark steel
              - box: [0.06, 0.06, 0.72]
                at: [x, s * 0.3, 0.36]
                colour: dark steel
      - for: {i: range(6)}
        parts:
          - box: [0.4, 0.3, 0.02]
            at: [-2.0 + 0.8 * i, 0.15 * (1 - 2 * (i % 2)), 0.77]
            colour: tray green

  serving line:
    about: the school kitchen's serving line, 6 m, steel with wells of food behind a glass guard and a tray rail in front.
    parent: counter run
    params: {length: 6.0, depth: 0.7, height: 0.9, front: steel, top: steel}
    parts:
      - for: {i: range(6)}
        parts:
          - box: [0.6, 0.4, 0.02]
            at: [-2.5 + i, 0.05, 0.905]
            colour: [orange, yellow, green][i % 3]
      - box: [6.0, 0.02, 0.35]
        at: [0, -0.2, 1.1]
        colour: glass
      - box: [6.0, 0.25, 0.03]
        at: [0, -0.48, 0.8]
        colour: steel

  library shelves:
    about: the library's wooden shelves, 6 m long and 1.9 m tall, lined with books.
    parent: shelving
    params: {length: 6.0, depth: 0.5, height: 1.9, goods: [book red, book blue, book green, white], frame: wood}

  janitor's shelves:
    about: the janitor's steel shelves, 5 m long and 1.6 m tall, cleaning jugs, rolls of paper and a mop bucket.
    parent: shelving
    params: {length: 5.0, depth: 0.5, height: 1.6, goods: [white, yellow, mop grey, cardboard], frame: dark steel}
