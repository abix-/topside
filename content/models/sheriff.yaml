# The sheriff's office and every thing in it (todo Model 17), built by
# scripts/models.py.
#
# The furniture at the sizes content's sheriff's office plan gives it (the
# front office's counter 4 m by 0.7 m and 1.1 m tall, the sheriff's desk
# 1.6 m by 0.8 m, the armory's gun rack 3 m by 0.5 m and 1.9 m tall, the
# evidence shelves 5 m by 0.5 m, each cell's bunk 2 m by 0.8 m), long side
# along x, front to -y, as the clinic's. The office desk and store shelf
# are the grocery's. Sizes and colours are Claude's.

colours:
  sheriff brown: [0.42, 0.3, 0.18]
  badge gold: [0.85, 0.7, 0.25]
  gun metal: [0.18, 0.18, 0.2]
  stock wood: [0.45, 0.28, 0.14]
  evidence box: [0.7, 0.6, 0.42]
  bunk grey: [0.45, 0.47, 0.5]

models:
  booking counter:
    about: the front office's counter, 4 m long, a brown front with the gold star on it and a ledge on top.
    parts:
      - box: [4.0, 0.08, 1.1]
        at: [0, -0.31, 0.55]
        colour: sheriff brown
      - box: [4.0, 0.3, 0.04]
        at: [0, -0.25, 1.12]
        colour: wood
      - box: [4.0, 0.6, 0.04]
        at: [0, 0.05, 0.74]
        colour: wood
      - for: {x: [-1.97, 1.97]}
        parts:
          - box: [0.06, 0.6, 0.72]
            at: [x, 0.05, 0.36]
            colour: sheriff brown
      - box: [0.3, 0.01, 0.3]
        at: [0, -0.36, 0.7]
        colour: badge gold

  sheriff's desk:
    about: the sheriff's desk, 1.6 m wide, dark wood with drawers down one side, a blotter and a nameplate.
    parts:
      - box: [1.6, 0.8, 0.05]
        at: [0, 0, 0.73]
        colour: sheriff brown
      - box: [0.45, 0.75, 0.7]
        at: [0.55, 0, 0.35]
        colour: sheriff brown
      - for: {d: range(3)}
        parts:
          - box: [0.4, 0.01, 0.2]
            at: [0.55, -0.38, 0.12 + 0.23 * d]
            colour: wood
      - box: [0.05, 0.75, 0.7]
        at: [-0.77, 0, 0.35]
        colour: sheriff brown
      - box: [0.6, 0.4, 0.01]
        at: [-0.1, 0.05, 0.76]
        colour: green
      - box: [0.3, 0.06, 0.08]
        at: [-0.1, -0.3, 0.79]
        colour: badge gold

  gun rack:
    about: the armory's wall rack, 3 m long and 1.9 m tall, long guns standing in a row and boxes of shells on its shelf.
    parts:
      - box: [3.0, 0.04, 1.9]
        at: [0, 0.23, 0.95]
        colour: dark steel
      - box: [3.0, 0.5, 0.06]
        at: [0, 0, 0.1]
        colour: dark steel
      - box: [3.0, 0.4, 0.04]
        at: [0, 0.05, 1.6]
        colour: dark steel
      - for: {i: range(10)}
        let: {x: -1.35 + 0.3 * i}
        parts:
          - box: [0.06, 0.08, 0.45]
            at: [x, 0.1, 0.36]
            colour: stock wood
          - box: [0.04, 0.06, 0.8]
            at: [x, 0.12, 0.98]
            colour: gun metal
      - for: {i: range(6)}
        parts:
          - box: [0.25, 0.2, 0.12]
            at: [-1.25 + 0.5 * i, 0.05, 1.68]
            colour: [red, green, yellow][i % 3]

  evidence shelves:
    about: the evidence room's steel shelves, 5 m long and 1.8 m tall, lined with brown evidence boxes.
    parent: stocked
    params: {length: 5.0, depth: 0.5, levels: 4, top: 1.8, goods: [evidence box, cardboard, white]}

  cell bunk:
    about: a cell's steel bunk, 2 m long and 0.8 m wide, bolted to the wall, a thin grey mattress on it.
    parts:
      - box: [2.0, 0.8, 0.06]
        at: [0, 0, 0.42]
        colour: dark steel
      - box: [1.9, 0.7, 0.08]
        at: [0, 0, 0.49]
        colour: bunk grey
      - for: {x: [-0.9, 0.9]}
        parts:
          - box: [0.06, 0.06, 0.42]
            at: [x, -0.35, 0.21]
            colour: dark steel

  gun locker:
    about: a tall steel gun locker 0.7 m wide, its door shut with a combination dial and a handle.
    parts:
      - box: [0.7, 0.5, 1.8]
        at: [0, 0, 0.9]
        colour: gun metal
      - box: [0.6, 0.01, 1.65]
        at: [0, -0.255, 0.9]
        colour: dark steel
      - cylinder: [0.06, 0.03]
        along: Y
        at: [0.15, -0.27, 1.1]
        colour: steel
      - box: [0.03, 0.04, 0.3]
        at: [0.22, -0.27, 0.9]
        colour: steel
