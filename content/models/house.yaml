  wood: [0.45, 0.32, 0.2]
  dark wood: [0.3, 0.2, 0.12]
  white: [0.88, 0.88, 0.86]
  steel: [0.6, 0.62, 0.65]
  black: [0.1, 0.1, 0.11]
  fabric: [0.35, 0.4, 0.5]
  cushion: [0.42, 0.47, 0.57]
  glass: [0.2, 0.25, 0.3]
  brick: [0.55, 0.28, 0.2]
  brass: [0.75, 0.62, 0.3]
  light globe: [0.98, 0.95, 0.8]
  detector light: [0.8, 0.1, 0.1]
  breaker door: [0.5, 0.52, 0.55]
  lamp shade: [0.92, 0.86, 0.7]
  wax: [0.95, 0.93, 0.85]
  flame: [1.0, 0.7, 0.2]
  pegboard: [0.6, 0.5, 0.35]
  toolbox red: [0.7, 0.12, 0.1]
  safe: [0.2, 0.22, 0.25]
  safe door: [0.25, 0.27, 0.3]
  mailbox flag: [0.8, 0.1, 0.1]
  trash can: [0.2, 0.35, 0.2]
  phone: [0.82, 0.78, 0.68]
  garden wood: [0.5, 0.38, 0.25]
  soil: [0.25, 0.17, 0.1]

models:
  legs:
    about: four legs under a top x by y, h tall.
    template: true
    params: {x: 1.0, y: 1.0, h: 0.7, r: 0.025, colour: wood}
    parts:
      - for: {sx: [1, -1], sy: [1, -1]}
        parts:
          - cylinder: [r, h]
            at: [sx * (x / 2 - r * 2), sy * (y / 2 - r * 2), h / 2]
            colour: colour

  cabinet:
    about: a box of its size with its doors (or drawers) marked on its front.
    template: true
    params: {x: 1.0, y: 0.5, z: 1.0, colour: wood, doors: 2, drawers: 0, knob: brass}
    let:
      rows: drawers or 1
      cols: 1 if drawers else doors
      w: x / cols
      h: z / rows
    parts:
      - box: [x, y, z]
        at: [0, 0, z / 2]
        colour: colour
      - for: {r: range(rows), d: range(cols)}
        let:
          cx: -x / 2 + w * (d + 0.5)
          cz: h * (r + 0.5)
        parts:
          - box: [w - 0.03, 0.01, h - 0.03]
            at: [cx, -y / 2 - 0.005, cz]
            colour: dark wood
          - box: [0.03, 0.02, 0.03]
            at: ["cx if drawers else cx + (w / 2 - 0.06) * (1 if d % 2 == 0 else -1)", -y / 2 - 0.015, cz]
            colour: knob

  couch:
    about: a couch, its seat cushions between its arms.
    params: {length: 2.0, depth: 0.9, height: 0.8}
    let:
      arm: 0.15
      seats: max(1, round((length - 2 * arm) / 0.6))
      w: (length - 2 * arm) / seats
    parts:
      - box: [length, depth, 0.3]
        at: [0, 0, 0.25]
        colour: fabric
      - model: legs
        params: {x: length, y: depth, h: 0.1, r: 0.03, colour: dark wood}
      - for: {i: range(seats)}
        parts:
          - box: [w - 0.02, depth - 0.25, 0.12]
            at: [-length / 2 + arm + w * (i + 0.5), -0.1, 0.46]
            colour: cushion
      - box: [length, 0.2, height - 0.1]
        at: [0, depth / 2 - 0.1, (height - 0.1) / 2 + 0.1]
        colour: fabric
      - for: {s: [1, -1]}
        parts:
          - box: [arm, depth, 0.55]
            at: [s * (length / 2 - arm / 2), 0, 0.375]
            colour: fabric

