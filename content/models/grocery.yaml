# The grocery store and every thing in it (todo Model 2), built by
# scripts/models.py.
#
# The furniture at the sizes content's GROCERY_STORE plan gives it (an aisle
# 7 m by 0.8 m and 1.6 m tall, the checkout 3 m by 0.8 m, the office desk
# 1.4 m by 0.7 m, the stockroom's rack 9 m by 0.8 m and 2 m tall), long side
# along x, front to -y; the things it holds at a store's. Sizes and colours
# are Claude's.

colours:
  rack blue: [0.2, 0.3, 0.6]
  meat: [0.7, 0.3, 0.3]

models:
  stocked:
    about: shelves of length by depth on a steel back, levels of them up to top, each lined with goods in the store's colours.
    template: true
    params: {length: 7.0, depth: 0.8, levels: 4, top: 1.6, goods: [red, green, yellow, orange, white]}
    let:
      step: (top - 0.15) / levels
      n: max(1, int(length / 0.5))
      w: length / n
    parts:
      - box: [length, 0.04, top]
        at: [0, 0, top / 2]
        colour: dark steel
      - box: [length, depth, 0.12]
        at: [0, 0, 0.06]
        colour: dark steel
      - for: {lv: range(levels), s: [1, -1]}
        if: not (depth < 0.5 and s == 1)
        let: {z: 0.12 + step * lv}
        parts:
          - box: [length, depth / 2 - 0.03, 0.025]
            at: [0, s * depth / 4, z]
            colour: steel
          - for: {i: range(n)}
            parts:
              - box: [w - 0.08, depth / 2 - 0.1, step * 0.6]
                at: [-length / 2 + w * (i + 0.5), s * depth / 4, z + 0.0125 + step * 0.3]
                colour: goods[(lv + i + (s > 0)) % len(goods)]

  grocery aisle:
    about: a double-sided aisle of shelves, 7 m long, goods on both faces.
    parent: stocked
    params: {length: 7.0, depth: 0.8, levels: 4, top: 1.6}

  store shelf:
    about: a single-sided store shelf of canned goods, 1.2 m wide and 1.8 m tall.
    parent: stocked
    params: {length: 1.2, depth: 0.45, levels: 5, top: 1.8}

  checkout counter:
    about: the checkout, a counter with its black belt, the bagging end, and the candy rack at the customer's side.
    parts:
      - box: [3.0, 0.8, 0.85]
        at: [0, 0, 0.425]
        colour: white
      - box: [1.8, 0.45, 0.03]
        at: [-0.5, 0, 0.865]
        colour: belt
      - box: [0.9, 0.6, 0.02]
        at: [1.0, 0, 0.86]
        colour: steel
      - box: [0.3, 0.04, 0.04]
        at: [-1.2, 0, 0.9]
        colour: red
      - box: [0.8, 0.15, 0.9]
        at: [-0.6, -0.48, 0.45]
        colour: dark steel
      - for: {i: range(4)}
        parts:
          - box: [0.7, 0.04, 0.12]
            at: [-0.6, -0.57, 0.15 + 0.2 * i]
            colour: "['red', 'yellow', 'orange', 'green'][i]"

  work desk:
    about: a steel office desk, its top, a drawer pedestal and a modesty panel.
    parts:
      - box: [1.4, 0.7, 0.04]
        at: [0, 0, 0.73]
        colour: wood
      - box: [0.4, 0.65, 0.71]
        at: [0.48, 0, 0.355]
        colour: dark steel
      - for: {i: range(3)}
        parts:
          - box: [0.36, 0.01, 0.2]
            at: [0.48, -0.33, 0.12 + 0.23 * i]
            colour: steel
      - box: [0.95, 0.03, 0.5]
        at: [-0.2, 0.3, 0.45]
        colour: dark steel
      - box: [0.04, 0.65, 0.71]
        at: [-0.68, 0, 0.355]
        colour: dark steel

  stock rack:
    about: the stockroom's pallet racking, orange uprights, blue beams, cases of stock on two levels, 9 m long and 2 m tall.
    let: {bays: 4, w: 9.0 / 4}
    parts:
      - for: {i: range(bays + 1), s: [1, -1]}
        parts:
          - box: [0.08, 0.08, 2.0]
            at: [-4.5 + w * i, s * 0.36, 1.0]
            colour: orange
      - for: {z: [0.15, 1.05, 1.95], s: [1, -1]}
        parts:
          - box: [9.0, 0.06, 0.1]
            at: [0, s * 0.36, z]
            colour: rack blue
      - for: {z: [0.15, 1.05], i: range(bays), k: range(3)}
        parts:
          - box: [0.6, 0.6, 0.45]
            at: [-4.5 + w * i + 0.4 + 0.7 * k, 0, z + 0.275]
            colour: cardboard

  cash register:
    about: a cash register on the checkout, its drawer, keys and display.
    lift: 0.85
    parts:
      - box: [0.4, 0.4, 0.1]
        at: [0, 0, 0.05]
        colour: dark steel
      - box: [0.3, 0.25, 0.08]
        at: [0, -0.03, 0.14]
        colour: black
      - for: {i: range(12)}
        parts:
          - box: [0.04, 0.04, 0.01]
            at: [-0.09 + 0.06 * (i % 4), -0.1 + 0.06 * (i // 4), 0.185]
            colour: white
      - box: [0.2, 0.04, 0.1]
        at: [0, 0.12, 0.25]
        colour: glass
      - box: [0.04, 0.04, 0.12]
        at: [0, 0.12, 0.16]
        colour: black

  pallet:
    about: a wooden pallet stacked with cases of canned food under shrink wrap.
    parts:
      - for: {i: range(3)}
        parts:
          - box: [1.2, 0.1, 0.1]
            at: [0, -0.45 + 0.45 * i, 0.05]
            colour: wood
      - for: {i: range(7)}
        parts:
          - box: [0.12, 1.0, 0.03]
            at: [-0.54 + 0.18 * i, 0, 0.115]
            colour: wood
      - for: {lv: range(3), i: range(2), k: range(2)}
        parts:
          - box: [0.56, 0.47, 0.3]
            at: [-0.29 + 0.58 * i, -0.245 + 0.49 * k, 0.28 + 0.31 * lv]
            colour: cardboard

  walk-in cooler:
    about: the walk-in cooler's unit and racks, the blower on the wall, its racks of cold goods below.
    parts:
      - box: [1.0, 0.5, 0.4]
        at: [0, 0.05, 2.0]
        colour: white
      - box: [0.9, 0.01, 0.3]
        at: [0, -0.205, 2.0]
        colour: dark steel
      - for: {i: range(3)}
        parts:
          - cylinder: [0.1, 0.01]
            sides: 12
            along: Y
            at: [-0.3 + 0.3 * i, -0.215, 2.0]
            colour: black
      - box: [1.0, 0.5, 1.5]
        at: [0, 0.05, 0.75]
        colour: steel
      - for: {lv: range(3)}
        parts:
          - box: [0.9, 0.4, 0.3]
            at: [0, 0.05, 0.25 + 0.5 * lv]
            colour: "'meat' if lv == 1 else 'white'"

  office desk:
    about: the store office's desk, a wooden desk with a computer, a lamp and papers.
    parts:
      - box: [1.2, 0.6, 0.04]
        at: [0, 0, 0.73]
        colour: wood
      - for: {s: [1, -1]}
        parts:
          - box: [0.04, 0.6, 0.71]
            at: [s * 0.58, 0, 0.355]
            colour: wood
      - box: [0.45, 0.05, 0.3]
        at: [0, 0.15, 0.95]
        colour: black
      - box: [0.41, 0.01, 0.26]
        at: [0, 0.12, 0.95]
        colour: glass
      - box: [0.4, 0.15, 0.02]
        at: [0, -0.1, 0.76]
        colour: black
      - box: [0.22, 0.3, 0.02]
        at: [0.4, -0.05, 0.76]
        colour: white
