# The town's places (topside-town "What the town has"), each a blueprint
# that modforge's plan::build makes into a building: named rooms on a grid
# of columns (west to east) and rows (front to back, the front toward its
# street), the ways between rooms (from a room east or north, `door` when
# one is hung, else an open way), the ways out (a room's outside wall and
# the way's width), each room's furniture (where it sits as a share of the
# room, -0.5 to 0.5 across and along, its size, and the model it is drawn
# as; one with no model is a block), the things used in it (where each
# stands as a share of the first room of that name), the things standing
# outside (metres from the middle, +z its front), the wall colours one is
# picked from, and its height. `edge` puts it at the edge of town, else on
# main street. Sizes are metres, colours sRGB. Read by content's `places`.

