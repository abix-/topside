# The one test runner for topside (cargo-nextest), run through
# scripts/build.ps1 test. Every test runs in its own process, prints
# its time, and keeps its output in logs/nextest/default/junit.xml
# whether it passed or failed.

[store]
# Beside the other logs, not in the shared target directory.
dir = "logs/nextest"

[profile.default]
# One failure never hides another.
fail-fast = false
# Every test's result and time as it finishes; the summary repeats
# only the slow and the failed.
status-level = "all"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
# A test past 30 s is reported slow each 30 s, and stopped at 2 min.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.default.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true

# Tests that talk to the real game on 127.0.0.1:15703 share that port.
[test-groups.real-game]
max-threads = 1

[[profile.default.overrides]]
# The test queue's runner (build.ps1 queue) runs many tests one after
# another, each stopped at 2 min by the runner itself; the run as a whole
# is stopped at 2 hours.
filter = 'test(=queue::run_the_queue)'
slow-timeout = { period = "60s", terminate-after = 120 }

[[profile.default.overrides]]
# The play-through's save makers (build.ps1 saves) play long spans of the
# game once to make each save; each is stopped at 1 hour.
filter = 'test(/^saves::make::/)'
slow-timeout = { period = "60s", terminate-after = 60 }
test-group = "real-game"

[[profile.default.overrides]]
# And the tests that move the player (the `use` op) or drive the mouse:
# one at a time, or they pull the one player two ways.
filter = 'test(/^game::/) | test(/^control_plane::/) | test(/^talk::/) | test(/^talk_ui::/) | test(/^the_tap::/) | test(/^episode::/) | test(/^relationship::/) | test(/^leading::/) | test(/^command::/) | test(/^bunker::/) | test(/^navmesh::/) | test(/^roxanne::/) | test(/^trade::/) | test(/^save::/) | test(/^opening::/) | test(/^holding::/) | test(/^stocking::/) | test(/^newcomers::/) | test(/^joining::/) | test(/^drawn_from::/)'
test-group = "real-game"
